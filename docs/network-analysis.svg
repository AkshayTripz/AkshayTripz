<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      @keyframes networkFlow {
        0%, 100% { stroke-dashoffset: 50; }
        50% { stroke-dashoffset: 0; }
      }
      @keyframes nodePulse {
        0%, 100% { r: 5; opacity: 0.6; }
        50% { r: 8; opacity: 1; }
      }
      .line { animation: networkFlow 3s ease-in-out infinite; }
      .node { animation: nodePulse 2s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="200" height="200" fill="#0a0a0f" opacity="0.3" rx="8"/>
  
  <!-- Network connections -->
  <line x1="60" y1="60" x2="140" y2="60" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="50" class="line"/>
  <line x1="140" y1="60" x2="140" y2="140" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="50" class="line" style="animation-delay: 0.3s"/>
  <line x1="140" y1="140" x2="60" y2="140" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="50" class="line" style="animation-delay: 0.6s"/>
  <line x1="60" y1="140" x2="60" y2="60" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="50" class="line" style="animation-delay: 0.9s"/>
  
  <!-- Network nodes -->
  <circle cx="60" cy="60" r="5" class="node" fill="#a855f7"/>
  <circle cx="140" cy="60" r="5" class="node" fill="#ff8c00" style="animation-delay: 0.3s"/>
  <circle cx="140" cy="140" r="5" class="node" fill="#00d4ff" style="animation-delay: 0.6s"/>
  <circle cx="60" cy="140" r="5" class="node" fill="#a855f7" style="animation-delay: 0.9s"/>
  <circle cx="100" cy="100" r="5" class="node" fill="#ff0040" style="animation-delay: 1.2s"/>
  
  <rect width="200" height="200" fill="none" stroke="#00d4ff" stroke-width="2" rx="8" opacity="0.5"/>
</svg>