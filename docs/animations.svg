<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Radar Animation -->
    <style>
      @keyframes radarSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseRing {
        0% { r: 10; opacity: 1; }
        100% { r: 150; opacity: 0; }
      }
      @keyframes glowPulse {
        0%, 100% { filter: drop-shadow(0 0 5px #00d4ff); }
        50% { filter: drop-shadow(0 0 15px #a855f7); }
      }
      .radar-scan { animation: radarSpin 3s linear infinite; }
      .pulse-ring { animation: pulseRing 2s ease-out infinite; }
      .glow { animation: glowPulse 2s ease-in-out infinite; }
    </style>
    
    <!-- Gradient Definitions -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#0a0a0f" opacity="0.8"/>

  <!-- Outer Circle -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#cyanGrad)" stroke-width="2"/>

  <!-- Static Rings -->
  <circle cx="200" cy="200" r="120" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.4" stroke-dasharray="5,5"/>
  <circle cx="200" cy="200" r="90" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/>
  <circle cx="200" cy="200" r="60" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.2" stroke-dasharray="5,5"/>

  <!-- Radar Scan Line (Rotating) -->
  <g class="radar-scan" transform-origin="200px 200px">
    <line x1="200" y1="200" x2="200" y2="40" stroke="url(#cyanGrad)" stroke-width="2"/>
    <line x1="200" y1="200" x2="230" y2="50" stroke="#a855f7" stroke-width="1" opacity="0.6"/>
    <line x1="200" y1="200" x2="170" y2="50" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Pulse Rings (Expanding outward) -->
  <circle cx="200" cy="200" class="pulse-ring" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
  <circle cx="200" cy="200" class="pulse-ring" fill="none" stroke="#a855f7" stroke-width="1.5" style="animation-delay: 0.7s"/>
  <circle cx="200" cy="200" class="pulse-ring" fill="none" stroke="#00d4ff" stroke-width="1.5" style="animation-delay: 1.4s"/>

  <!-- Center Glow Point -->
  <circle cx="200" cy="200" r="8" fill="url(#centerGrad)" class="glow"/>
  <circle cx="200" cy="200" r="4" fill="#00d4ff" opacity="0.8"/>

  <!-- Radar Points (Data dots) -->
  <circle cx="200" cy="100" r="3" fill="#00d4ff" class="glow"/>
  <circle cx="290" cy="150" r="3" fill="#a855f7" class="glow"/>
  <circle cx="300" cy="250" r="3" fill="#00d4ff" class="glow"/>
  <circle cx="220" cy="320" r="3" fill="#a855f7" class="glow"/>
  <circle cx="100" cy="280" r="3" fill="#00d4ff" class="glow"/>
  <circle cx="80" cy="180" r="3" fill="#a855f7" class="glow"/>

  <!-- Corner Accents -->
  <line x1="20" y1="20" x2="50" y2="20" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
  <line x1="20" y1="20" x2="20" y2="50" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>
  
  <line x1="380" y1="20" x2="350" y2="20" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
  <line x1="380" y1="20" x2="380" y2="50" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>

  <line x1="20" y1="380" x2="50" y2="380" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>
  <line x1="20" y1="380" x2="20" y2="350" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>

  <line x1="380" y1="380" x2="350" y2="380" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>
  <line x1="380" y1="380" x2="380" y2="350" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
</svg>
