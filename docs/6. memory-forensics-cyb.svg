<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            @keyframes fill-animate { 0% { fill-opacity: 0.2; } 50% { fill-opacity: 1; } 100% { fill-opacity: 0.2; } }
            @keyframes ripple { 0% { r: 20px; opacity: 1; } 100% { r: 60px; opacity: 0; } }
            @keyframes bounce-particle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
            .fill { animation: fill-animate 2s ease-in-out infinite; }
            .ripple { animation: ripple 2s ease-out infinite; }
            .bounce { animation: bounce-particle 1.5s ease-in-out infinite; }
        </style>
    </defs>
    <rect width="200" height="200" fill="#0f1419" rx="10"/>
    <rect x="40" y="50" width="25" height="100" fill="#00d9ff" class="fill"/>
    <rect x="75" y="70" width="25" height="80" fill="#b700ff" class="fill" style="animation-delay: 0.2s"/>
    <rect x="110" y="60" width="25" height="90" fill="#ff006e" class="fill" style="animation-delay: 0.4s"/>
    <rect x="145" y="80" width="25" height="70" fill="#00d9ff" class="fill" style="animation-delay: 0.6s"/>
    <circle cx="100" cy="30" r="10" fill="none" stroke="#00d9ff" stroke-width="2" class="ripple"/>
</svg>
