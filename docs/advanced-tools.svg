<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      @keyframes toolRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes toolGlow {
        0%, 100% { filter: drop-shadow(0 0 2px #a855f7); }
        50% { filter: drop-shadow(0 0 8px #00d4ff); }
      }
      .tool { animation: toolRotate 4s linear infinite; transform-origin: 100px 100px; }
      .toolBox { animation: toolGlow 2s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="200" height="200" fill="#0a0a0f" opacity="0.3" rx="8"/>
  
  <!-- Tool box -->
  <rect x="55" y="65" width="90" height="70" fill="none" stroke="#a855f7" stroke-width="2" class="toolBox" rx="4"/>
  
  <!-- Wrench (rotating) -->
  <g class="tool">
    <line x1="80" y1="80" x2="120" y2="120" stroke="#ff8c00" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="80" r="6" fill="#00d4ff"/>
  </g>
  
  <text x="100" y="155" text-anchor="middle" font-family="monospace" font-size="10" fill="#00d4ff">TOOLS</text>
  <rect width="200" height="200" fill="none" stroke="#ff8c00" stroke-width="2" rx="8" opacity="0.5"/>
</svg>