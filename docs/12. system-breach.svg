<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            @keyframes break-apart { 0% { transform: translate(0, 0); } 50% { transform: translate(-5px, -5px); } 100% { transform: translate(0, 0); } }
            @keyframes warning-flash { 0%, 100% { fill-opacity: 0.5; } 50% { fill-opacity: 1; } }
            @keyframes shield-glow { 0%, 100% { filter: drop-shadow(0 0 3px #ff006e); } 50% { filter: drop-shadow(0 0 12px #ff006e); } }
            .break { animation: break-apart 2s ease-in-out infinite; }
            .warning { animation: warning-flash 1s ease-in-out infinite; }
            .shield { animation: shield-glow 1.5s ease-in-out infinite; }
        </style>
    </defs>
    <rect width="200" height="200" fill="#0f1419" rx="10"/>
    <path d="M 100 50 L 150 75 L 150 125 Q 100 160 100 160 Q 50 160 50 125 L 50 75 Z" fill="none" stroke="#ff006e" stroke-width="2" class="shield"/>
    <line x1="80" y1="90" x2="120" y2="130" stroke="#ff006e" stroke-width="2" class="break"/>
    <line x1="120" y1="90" x2="80" y2="130" stroke="#ff006e" stroke-width="2" class="break"/>
    <circle cx="100" cy="110" r="20" fill="none" stroke="#00d9ff" stroke-width="2" class="warning" opacity="0.7"/>
</svg>
