<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      @keyframes deobfuscate {
        0% { opacity: 0; }
        50% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes lockBreak {
        0%, 100% { transform: scaleX(1); }
        50% { transform: scaleX(1.1); }
      }
      .locked { animation: lockBreak 2s ease-in-out infinite; transform-origin: 100px 100px; }
      .text { animation: deobfuscate 2s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="200" height="200" fill="#0a0a0f" opacity="0.3" rx="8"/>
  
  <!-- Locked representation -->
  <rect x="60" y="70" width="80" height="60" fill="none" stroke="#00d4ff" stroke-width="2" class="locked"/>
  <circle cx="100" cy="100" r="8" fill="none" stroke="#a855f7" stroke-width="2"/>
  
  <!-- Deobfuscating text -->
  <text x="100" y="145" text-anchor="middle" font-family="monospace" font-size="12" fill="#ff8c00" class="text">DECODED</text>
  
  <rect width="200" height="200" fill="none" stroke="#a855f7" stroke-width="2" rx="8" opacity="0.5"/>
</svg>