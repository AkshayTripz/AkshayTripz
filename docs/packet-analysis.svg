<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      @keyframes packetFlow {
        0% { transform: translateY(-30px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(30px); opacity: 0; }
      }
      @keyframes packetGlow {
        0%, 100% { fill: #00d4ff; }
        50% { fill: #a855f7; }
      }
      .packet { animation: packetFlow 3s linear infinite; }
      .pkt { animation: packetGlow 1.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="200" height="200" fill="#0a0a0f" opacity="0.3" rx="8"/>
  
  <!-- Packet stream -->
  <g class="packet">
    <rect x="85" y="60" width="30" height="20" class="pkt" rx="2"/>
  </g>
  
  <g class="packet" style="animation-delay: 0.5s">
    <rect x="85" y="90" width="30" height="20" class="pkt" rx="2" style="animation-delay: 0.5s"/>
  </g>
  
  <g class="packet" style="animation-delay: 1s">
    <rect x="85" y="120" width="30" height="20" class="pkt" rx="2" style="animation-delay: 1s"/>
  </g>
  
  <!-- Connection lines -->
  <line x1="60" y1="70" x2="140" y2="70" stroke="#a855f7" stroke-width="1" opacity="0.3"/>
  <line x1="60" y1="100" x2="140" y2="100" stroke="#a855f7" stroke-width="1" opacity="0.3"/>
  <line x1="60" y1="130" x2="140" y2="130" stroke="#a855f7" stroke-width="1" opacity="0.3"/>
  
  <text x="100" y="160" text-anchor="middle" font-family="monospace" font-size="10" fill="#00d4ff">PACKETS</text>
  <rect width="200" height="200" fill="none" stroke="#a855f7" stroke-width="2" rx="8" opacity="0.5"/>
</svg>