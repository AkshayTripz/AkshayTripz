<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            @keyframes slide-text { 0% { transform: translateX(-100px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
            @keyframes bracket-pulse { 0%, 100% { stroke-width: 2; filter: drop-shadow(0 0 2px #00d9ff); } 50% { stroke-width: 3; filter: drop-shadow(0 0 8px #b700ff); } }
            @keyframes highlight-flash { 0%, 100% { fill-opacity: 0.2; } 50% { fill-opacity: 0.6; } }
            .slide { animation: slide-text 2s ease-out forwards; }
            .bracket { animation: bracket-pulse 1.5s ease-in-out infinite; }
            .highlight { animation: highlight-flash 2s ease-in-out infinite; }
        </style>
    </defs>
    <rect width="200" height="200" fill="#0f1419" rx="10"/>
    <path d="M 50 70 L 60 60 L 60 140 L 50 130" fill="none" stroke="#00d9ff" stroke-width="2" class="bracket"/>
    <path d="M 150 70 L 140 60 L 140 140 L 150 130" fill="none" stroke="#b700ff" stroke-width="2" class="bracket" style="animation-delay: 0.2s"/>
    <line x1="70" y1="80" x2="130" y2="80" stroke="#ff006e" stroke-width="2" class="slide"/>
    <line x1="70" y1="100" x2="130" y2="100" stroke="#00d9ff" stroke-width="2" class="slide" style="animation-delay: 0.3s"/>
    <line x1="70" y1="120" x2="130" y2="120" stroke="#b700ff" stroke-width="2" class="slide" style="animation-delay: 0.6s"/>
</svg>
