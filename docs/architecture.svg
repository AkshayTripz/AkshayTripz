<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      @keyframes cpuSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes coreGlow {
        0%, 100% { fill: #00d4ff; }
        50% { fill: #a855f7; }
      }
      .cpu { animation: cpuSpin 4s linear infinite; transform-origin: 100px 100px; }
      .core { animation: coreGlow 2s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="200" height="200" fill="#0a0a0f" opacity="0.3" rx="8"/>
  
  <!-- CPU Architecture -->
  <g class="cpu">
    <rect x="60" y="60" width="80" height="80" fill="none" stroke="#00d4ff" stroke-width="2"/>
    <circle cx="100" cy="100" r="20" fill="none" stroke="#a855f7" stroke-width="2"/>
  </g>
  
  <!-- Core indicators -->
  <circle cx="70" cy="70" r="3" class="core"/>
  <circle cx="130" cy="70" r="3" class="core" style="animation-delay: 0.5s"/>
  <circle cx="130" cy="130" r="3" class="core" style="animation-delay: 1s"/>
  <circle cx="70" cy="130" r="3" class="core" style="animation-delay: 1.5s"/>
  
  <rect width="200" height="200" fill="none" stroke="#00d4ff" stroke-width="2" rx="8" opacity="0.5"/>
</svg>