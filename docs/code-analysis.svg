<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      @keyframes codeFlow {
        0% { transform: translateY(-20px); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateY(20px); opacity: 0; }
      }
      @keyframes syntaxGlow {
        0%, 100% { fill: #00d4ff; }
        50% { fill: #a855f7; }
      }
      .code-line { animation: codeFlow 2s ease-in-out infinite; }
      .bracket { animation: syntaxGlow 1.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="200" height="200" fill="#0a0a0f" opacity="0.3" rx="8"/>
  
  <!-- Code syntax -->
  <text x="100" y="70" text-anchor="middle" font-family="monospace" font-size="14" class="code-line" fill="#ff8c00">&lt;</text>
  <text x="100" y="100" text-anchor="middle" font-family="monospace" font-size="14" class="code-line" fill="#00d4ff" style="animation-delay: 0.4s">CODE</text>
  <text x="100" y="130" text-anchor="middle" font-family="monospace" font-size="14" class="code-line" fill="#a855f7" style="animation-delay: 0.8s">&gt;</text>
  
  <circle cx="70" cy="60" r="4" class="bracket" fill="#ff0040"/>
  <circle cx="130" cy="130" r="4" class="bracket" fill="#00d4ff" style="animation-delay: 0.5s"/>
  
  <rect width="200" height="200" fill="none" stroke="#ff8c00" stroke-width="2" rx="8" opacity="0.5"/>
</svg>