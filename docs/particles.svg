<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <style>
      @keyframes sparkleFloat {
        0% { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(0.3); opacity: 0; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      @keyframes glowPulse {
        0%, 100% { filter: drop-shadow(0 0 2px #00d4ff); }
        50% { filter: drop-shadow(0 0 8px #a855f7); }
      }
      .twinkle { animation: twinkle 2s ease-in-out infinite; }
      .glow { animation: glowPulse 1.5s ease-in-out infinite; }
    </style>

    <linearGradient id="sparkleGrad">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>

    <radialGradient id="sparkleRad">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#0a0a0f" opacity="0.5"/>

  <!-- Center Burst -->
  <circle cx="200" cy="200" r="3" fill="url(#sparkleGrad)" class="glow"/>

  <!-- Outer Sparkles (Burst Pattern) -->
  <g class="glow">
    <circle cx="200" cy="50" r="2.5" fill="#00d4ff"/>
    <circle cx="350" cy="100" r="2.5" fill="#a855f7"/>
    <circle cx="380" cy="250" r="2.5" fill="#00d4ff"/>
    <circle cx="300" cy="380" r="2.5" fill="#a855f7"/>
    <circle cx="100" cy="380" r="2.5" fill="#00d4ff"/>
    <circle cx="20" cy="300" r="2.5" fill="#a855f7"/>
    <circle cx="10" cy="150" r="2.5" fill="#00d4ff"/>
    <circle cx="50" cy="60" r="2.5" fill="#a855f7"/>
  </g>

  <!-- Mid-range Particles -->
  <g class="twinkle">
    <circle cx="200" cy="120" r="1.5" fill="#00d4ff" opacity="0.6"/>
    <circle cx="280" cy="150" r="1.5" fill="#a855f7" opacity="0.5"/>
    <circle cx="320" cy="200" r="1.5" fill="#00d4ff" opacity="0.5"/>
    <circle cx="280" cy="250" r="1.5" fill="#a855f7" opacity="0.6"/>
    <circle cx="200" cy="280" r="1.5" fill="#00d4ff" opacity="0.5"/>
    <circle cx="120" cy="250" r="1.5" fill="#a855f7" opacity="0.6"/>
    <circle cx="80" cy="200" r="1.5" fill="#00d4ff" opacity="0.5"/>
    <circle cx="120" cy="150" r="1.5" fill="#a855f7" opacity="0.5"/>
  </g>

  <!-- Connection Lines (Network effect) -->
  <g stroke="#00d4ff" stroke-width="0.5" opacity="0.3">
    <line x1="200" y1="200" x2="200" y2="50"/>
    <line x1="200" y1="200" x2="350" y2="100"/>
    <line x1="200" y1="200" x2="380" y2="250"/>
    <line x1="200" y1="200" x2="300" y2="380"/>
    <line x1="200" y1="200" x2="100" y2="380"/>
    <line x1="200" y1="200" x2="20" y2="300"/>
    <line x1="200" y1="200" x2="10" y2="150"/>
    <line x1="200" y1="200" x2="50" y2="60"/>
  </g>

  <!-- Small accent sparkles -->
  <circle cx="150" cy="100" r="1" fill="#00d4ff" opacity="0.4" class="twinkle"/>
  <circle cx="250" cy="100" r="1" fill="#a855f7" opacity="0.4" class="twinkle"/>
  <circle cx="300" cy="150" r="1" fill="#00d4ff" opacity="0.4" class="twinkle"/>
  <circle cx="320" cy="220" r="1" fill="#a855f7" opacity="0.4" class="twinkle"/>
  <circle cx="300" cy="290" r="1" fill="#00d4ff" opacity="0.4" class="twinkle"/>
  <circle cx="220" cy="330" r="1" fill="#a855f7" opacity="0.4" class="twinkle"/>
  <circle cx="120" cy="320" r="1" fill="#00d4ff" opacity="0.4" class="twinkle"/>
  <circle cx="60" cy="260" r="1" fill="#a855f7" opacity="0.4" class="twinkle"/>
  <circle cx="40" cy="170" r="1" fill="#00d4ff" opacity="0.4" class="twinkle"/>
  <circle cx="80" cy="80" r="1" fill="#a855f7" opacity="0.4" class="twinkle"/>
</svg>
