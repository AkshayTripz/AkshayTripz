<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            @keyframes pulse-glow { 0%, 100% { filter: drop-shadow(0 0 5px #00d9ff); } 50% { filter: drop-shadow(0 0 15px #b700ff); } }
            @keyframes rotate-fast { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
            @keyframes float-bounce { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
            .pulse { animation: pulse-glow 2s ease-in-out infinite; }
            .rotate { animation: rotate-fast 3s linear infinite; }
            .bounce { animation: float-bounce 2s ease-in-out infinite; }
        </style>
    </defs>
    <rect width="200" height="200" fill="#0f1419" rx="10"/>
    <circle cx="100" cy="100" r="70" fill="none" stroke="#00d9ff" stroke-width="2" class="rotate"/>
    <circle cx="100" cy="100" r="50" fill="none" stroke="#b700ff" stroke-width="2" opacity="0.6" class="pulse"/>
    <path d="M 100 40 L 100 160 M 40 100 L 160 100" stroke="#00d9ff" stroke-width="3" class="pulse" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="30" fill="none" stroke="#ff006e" stroke-width="2" class="bounce"/>
    <rect x="85" y="85" width="30" height="30" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.8"/>
</svg>
